name: QCLimit
options:
  bundleIdPrefix: com.qclimit
targets:
  QCLimit:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [QCLimit]
    info:
      path: QCLimit/Info.plist
      properties:
        CFBundleDisplayName: Recheck
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSpeechRecognitionUsageDescription: Dùng giọng nói để điền STD và dung sai.
        NSMicrophoneUsageDescription: Dùng micro để nghe STD và dung sai.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recheck.app
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
